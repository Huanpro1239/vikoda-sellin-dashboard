name: Vikoda Sell-In Pipeline

on:
  pull_request:
    paths:
      - 'code/**'
      - 'web/**'
      - 'package*.json'
      - 'requirements*.txt'
      - '.env.example'
      - 'README.md'
      - 'SECURITY.md'
      - 'HUONG_DAN_SHAREPOINT_GITHUB_ACTIONS.md'
      - '.github/workflows/vikoda_pipeline.yml'
  push:
    branches:
      - main
    paths:
      - 'code/**'
      - 'web/**'
      - 'package*.json'
      - 'requirements*.txt'
      - '.env.example'
      - 'README.md'
      - 'SECURITY.md'
      - 'HUONG_DAN_SHAREPOINT_GITHUB_ACTIONS.md'
      - '.github/workflows/vikoda_pipeline.yml'
  workflow_dispatch:
    inputs:
      run_cloud_refresh:
        description: 'Đọc dữ liệu mới nhất từ SharePoint, chạy ETL và cập nhật Data_Goc'
        required: true
        type: boolean
        default: true
      publish_dashboard:
        description: 'Publish dashboard sau khi dữ liệu đã được phê duyệt public/sanitized'
        required: true
        type: boolean
        default: false
  schedule:
    # 18:00 Việt Nam = 11:00 UTC
    - cron: '0 11 * * *'

permissions:
  contents: read

concurrency:
  group: 'vikoda-sellin-${{ github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository-hygiene:
    name: Reject production data in Git
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject changes under Data or web/data
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA_PR: ${{ github.event.pull_request.base.sha }}
          BASE_SHA_PUSH: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$BASE_SHA_PR"
          else
            BASE_SHA="$BASE_SHA_PUSH"
          fi
          if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "Không có base SHA hợp lệ; bỏ qua kiểm tra diff cho event này."
            exit 0
          fi
          blocked="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" | grep -E '^(Data/|web/data/)' || true)"
          if [[ -n "$blocked" ]]; then
            echo "::error::Không được commit dữ liệu sản xuất vào Git."
            echo "$blocked"
            exit 1
          fi

  test:
    name: Read-only CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned core dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements.txt
      - name: Run full Python test suite
        run: python code/run_all_tests.py --quiet
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify web JavaScript and regression tests
        run: npm run verify:web

  cloud-refresh:
    name: Refresh SharePoint and rebuild Sell-In outputs
    needs:
      - test
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_cloud_refresh)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      # Client ID/Tenant ID không phải mật khẩu; ưu tiên Repository Variables.
      # secrets.* chỉ là fallback tương thích nếu repo đã từng cấu hình theo cách cũ.
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      SHAREPOINT_SITE_ID: ${{ vars.SHAREPOINT_SITE_ID || secrets.SHAREPOINT_SITE_ID }}
      SHAREPOINT_DRIVE_ID: ${{ vars.SHAREPOINT_DRIVE_ID || secrets.SHAREPOINT_DRIVE_ID }}
      SHAREPOINT_HOSTNAME: ${{ vars.SHAREPOINT_HOSTNAME || 'vikodacomvn.sharepoint.com' }}
      SHAREPOINT_SITE_PATH: ${{ vars.SHAREPOINT_SITE_PATH || '/sites/Planning' }}
      SHAREPOINT_BASE_FOLDER: ${{ vars.SHAREPOINT_BASE_FOLDER || 'Vikoda_Sales_Data' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned core dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements.txt
      - name: Validate Microsoft OIDC configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [[ -z "${AZURE_CLIENT_ID:-}" ]]; then
            echo "::error::AZURE_CLIENT_ID Repository Variable is missing."
            missing=1
          fi
          if [[ -z "${AZURE_TENANT_ID:-}" ]]; then
            echo "::error::AZURE_TENANT_ID Repository Variable is missing."
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
          echo "Microsoft OIDC configuration: available"
      - name: Azure login with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Resolve SharePoint site and drive IDs
        run: python code/common/sharepoint_bootstrap.py
      - name: Download ERP workbooks from SharePoint
        run: >-
          python code/Skill/skill-bao-cao/scripts/sharepoint_graph_sync.py
          --action download
          --folder "${SHAREPOINT_BASE_FOLDER}/Data ERP"
          --local-dir "Data/CloudInputs/ERP"
          --require-cloud-auth
      - name: Download Target workbooks from SharePoint
        run: >-
          python code/Skill/skill-bao-cao/scripts/sharepoint_graph_sync.py
          --action download
          --folder "${SHAREPOINT_BASE_FOLDER}/Target"
          --local-dir "Data/CloudInputs/Target"
          --require-cloud-auth
      - name: Download customer catalog from SharePoint
        run: >-
          python code/Skill/skill-bao-cao/scripts/sharepoint_graph_sync.py
          --action download
          --folder "${SHAREPOINT_BASE_FOLDER}/Danh muc KH"
          --local-dir "Data/CloudInputs/DMKH"
          --require-cloud-auth
      - name: Download product catalog from SharePoint
        run: >-
          python code/Skill/skill-bao-cao/scripts/sharepoint_graph_sync.py
          --action download
          --folder "${SHAREPOINT_BASE_FOLDER}/Danh muc SP"
          --local-dir "Data/CloudInputs/DMSP"
          --require-cloud-auth
      - name: Execute strict Sell-In cloud pipeline
        run: >-
          python code/Skill/skill-bao-cao/scripts/run_cloud_pipeline.py
          --project-root .
          --strict
          --erp-source-dir "Data/CloudInputs/ERP"
          --target-source-dir "Data/CloudInputs/Target"
          --dmkh-source-dir "Data/CloudInputs/DMKH"
          --product-catalog "Data/CloudInputs/DMSP/Danh Muc San Pham.xlsx"
      - name: Finalize dashboard date from latest invoice
        run: python code/common/finalize_data_dates.py --project-root .
      - name: Run system health check
        run: python code/health_check.py
      - name: Verify processed Data_Goc workbooks exist
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(Data/Data_Goc/*.xlsx)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::Không có workbook .xlsx trong Data/Data_Goc sau ETL."
            exit 1
          fi
          echo "Sẵn sàng upload ${#files[@]} workbook vào SharePoint/Data_Goc."
      - name: Upload processed Data_Goc to SharePoint
        run: >-
          python code/Skill/skill-bao-cao/scripts/sharepoint_graph_sync.py
          --action upload
          --folder "${SHAREPOINT_BASE_FOLDER}/Data_Goc"
          --local-dir "Data/Data_Goc"
          --require-cloud-auth
      - name: Package approved dashboard for controlled deployment
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.publish_dashboard &&
          vars.ENABLE_PAGES_DEPLOY == 'true' &&
          vars.WEB_DATA_CLASSIFICATION == 'public-or-sanitized'
        uses: actions/upload-artifact@v4
        with:
          name: approved-dashboard-web
          path: web
          retention-days: 1
          if-no-files-found: error

  deploy-dashboard:
    name: Deploy approved dashboard to GitHub Pages
    needs:
      - cloud-refresh
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_dashboard &&
      vars.ENABLE_PAGES_DEPLOY == 'true' &&
      vars.WEB_DATA_CLASSIFICATION == 'public-or-sanitized'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download approved dashboard artifact
        uses: actions/download-artifact@v4
        with:
          name: approved-dashboard-web
          path: web
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
