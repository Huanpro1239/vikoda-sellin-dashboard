name: Vikoda Sell-In Pipeline
run-name: Vikoda Sell-In · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  pull_request:
    paths:
      - 'code/**'
      - 'web/**'
      - 'package*.json'
      - 'requirements*.txt'
      - '.env.example'
      - 'README.md'
      - 'SECURITY.md'
      - 'HUONG_DAN_SHAREPOINT_GITHUB_ACTIONS.md'
      - '.github/workflows/vikoda_pipeline.yml'
  push:
    branches: [main]
    paths:
      - 'code/**'
      - 'web/**'
      - 'package*.json'
      - 'requirements*.txt'
      - '.env.example'
      - 'README.md'
      - 'SECURITY.md'
      - 'HUONG_DAN_SHAREPOINT_GITHUB_ACTIONS.md'
      - '.github/workflows/vikoda_pipeline.yml'
  repository_dispatch:
    types: [sharepoint_changed]
  workflow_dispatch:
    inputs:
      run_cloud_refresh:
        description: 'Recalculate production plan and refresh changed Sell-In periods'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: 'vikoda-sellin-${{ github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository-hygiene:
    name: Reject production data committed to Git
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject changes under Data or web/data
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA_PR: ${{ github.event.pull_request.base.sha }}
          BASE_SHA_PUSH: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$BASE_SHA_PR"
          else
            BASE_SHA="$BASE_SHA_PUSH"
          fi
          if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "No valid base SHA; skip diff hygiene check."
            exit 0
          fi
          blocked="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" | grep -E '^(Data/|web/data/)' || true)"
          if [[ -n "$blocked" ]]; then
            echo "::error::Runtime data must not be committed to Git."
            echo "$blocked"
            exit 1
          fi

  test:
    name: Read-only CI
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Validate workflow least-privilege contract
        run: python code/common/validate_workflow_policy.py

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements.txt

      - name: Run full Python test suite
        run: python code/run_all_tests.py --quiet

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify dashboard JavaScript and regression tests
        run: npm run verify:web

  cloud-refresh:
    name: SharePoint production plan and incremental dashboard refresh
    needs: [test]
    if: >-
      always() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_cloud_refresh))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    outputs:
      source_changed: ${{ steps.source_change.outputs.changed }}
      change_reason: ${{ steps.source_change.outputs.reason }}
      rebuild_periods: ${{ steps.delta.outputs.rebuild_periods }}
    env:
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      SHAREPOINT_HOSTNAME: ${{ vars.SHAREPOINT_HOSTNAME || 'vikodacomvn.sharepoint.com' }}
      SHAREPOINT_SITE_PATH: ${{ vars.SHAREPOINT_SITE_PATH || '/sites/Planning' }}
      SHAREPOINT_BASE_FOLDER: ${{ vars.SHAREPOINT_BASE_FOLDER || 'Vikoda_Sales_Data' }}
      PIPELINE_STATE_FILE: ${{ vars.SHAREPOINT_PIPELINE_STATE_FILE || '_vikoda_pipeline_state.json' }}
      INCREMENTAL_STATE_FILE: ${{ vars.SHAREPOINT_INCREMENTAL_STATE_FILE || '_vikoda_incremental_state.json' }}
      PLANNING_SOURCE_ITEM_ID: ${{ vars.PLANNING_SOURCE_ITEM_ID || '01EX3DDZDCP23YZACRFBBZXS3XIFZXDAMW' }}
      PLANNING_TARGET_ITEM_ID: ${{ vars.PLANNING_TARGET_ITEM_ID || '01EX3DDZGDKHPGY5HLMJAJKFWC3IVMHDEL' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned production dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements.txt

      - name: Validate Microsoft OIDC configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${AZURE_CLIENT_ID:-}" ]] || { echo "::error::AZURE_CLIENT_ID Repository Variable is missing."; exit 1; }
          [[ -n "${AZURE_TENANT_ID:-}" ]] || { echo "::error::AZURE_TENANT_ID Repository Variable is missing."; exit 1; }
          echo "Microsoft OIDC configuration: available"

      - name: Azure login with GitHub OIDC for Microsoft Graph
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Resolve SharePoint site and drive IDs
        run: python code/common/sharepoint_bootstrap.py

      - name: Recalculate and publish production plan
        run: >-
          python code/production_planning/run_sharepoint.py
          --source-item-id "${PLANNING_SOURCE_ITEM_ID}"
          --target-item-id "${PLANNING_TARGET_ITEM_ID}"

      - name: Detect SharePoint source changes and affected ERP periods
        id: source_change
        shell: bash
        env:
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.run_cloud_refresh }}
        run: |
          set -euo pipefail
          args=(
            --action check
            --state-path "${SHAREPOINT_BASE_FOLDER}/Data_Goc/${PIPELINE_STATE_FILE}"
            --folder "${SHAREPOINT_BASE_FOLDER}/Data ERP"
            --folder "${SHAREPOINT_BASE_FOLDER}/Target"
            --folder "${SHAREPOINT_BASE_FOLDER}/DanhMuc_KH"
            --folder "${SHAREPOINT_BASE_FOLDER}/DanhMuc_SP"
            --manifest-file "Data/Work/sharepoint_source_manifest.json"
          )
          if [[ "$FORCE_REFRESH" == "true" ]]; then
            args+=(--force)
          fi
          python code/common/sharepoint_change_detector_v2.py "${args[@]}"

      - name: Skip unchanged dashboard sources
        if: steps.source_change.outputs.changed != 'true'
        run: echo "No Sell-In source change (${{ steps.source_change.outputs.reason }}). Production plan was still checked."

      - name: Download existing Data_Goc baseline
        if: steps.source_change.outputs.changed == 'true'
        run: >-
          python code/Skill/skill-bao-cao/scripts/sharepoint_graph_sync.py
          --action download
          --folder "${SHAREPOINT_BASE_FOLDER}/Data_Goc"
          --local-dir "Data/CloudInputs/Data_GocBaseline"
          --require-cloud-auth

      - name: Download ERP workbooks
        if: steps.source_change.outputs.changed == 'true'
        run: >-
          python code/Skill/skill-bao-cao/scripts/sharepoint_graph_sync.py
          --action download
          --folder "${SHAREPOINT_BASE_FOLDER}/Data ERP"
          --local-dir "Data/CloudInputs/ERP"
          --require-cloud-auth

      - name: Download Target workbooks
        if: steps.source_change.outputs.changed == 'true'
        run: >-
          python code/Skill/skill-bao-cao/scripts/sharepoint_graph_sync.py
          --action download
          --folder "${SHAREPOINT_BASE_FOLDER}/Target"
          --local-dir "Data/CloudInputs/Target"
          --require-cloud-auth

      - name: Download customer catalog
        if: steps.source_change.outputs.changed == 'true'
        run: >-
          python code/Skill/skill-bao-cao/scripts/sharepoint_graph_sync.py
          --action download
          --folder "${SHAREPOINT_BASE_FOLDER}/DanhMuc_KH"
          --local-dir "Data/CloudInputs/DMKH"
          --require-cloud-auth

      - name: Download product catalog
        if: steps.source_change.outputs.changed == 'true'
        run: >-
          python code/Skill/skill-bao-cao/scripts/sharepoint_graph_sync.py
          --action download
          --folder "${SHAREPOINT_BASE_FOLDER}/DanhMuc_SP"
          --local-dir "Data/CloudInputs/DMSP"
          --require-cloud-auth

      - name: Rebuild only changed Data_Goc periods and dashboard data
        if: steps.source_change.outputs.changed == 'true'
        shell: bash
        env:
          ERP_PERIODS: ${{ steps.source_change.outputs.erp_periods }}
        run: |
          set -euo pipefail
          args=(
            --project-root .
            --erp-source-dir "Data/CloudInputs/ERP"
            --baseline-data-goc-dir "Data/CloudInputs/Data_GocBaseline"
            --target-source-dir "Data/CloudInputs/Target"
            --dmkh-source-dir "Data/CloudInputs/DMKH"
            --product-catalog "Data/CloudInputs/DMSP/Danh Muc San Pham.xlsx"
            --incremental-state-file "Data/CloudInputs/Data_GocBaseline/${INCREMENTAL_STATE_FILE}"
            --plan-file "Data/Work/incremental_cloud_plan.json"
            --delta-dir "Data/CloudOutputs/Data_GocDelta"
            --summary-file "Data/Work/incremental_cloud_summary.json"
          )
          IFS=',' read -ra periods <<< "${ERP_PERIODS:-}"
          for period in "${periods[@]}"; do
            [[ -n "$period" ]] && args+=(--force-period "$period")
          done
          python code/common/incremental_cloud_pipeline.py "${args[@]}"

      - name: Finalize dashboard date from latest invoice
        if: steps.source_change.outputs.changed == 'true'
        run: python code/common/finalize_data_dates.py --project-root .

      - name: Run system health check
        if: steps.source_change.outputs.changed == 'true'
        run: python code/health_check.py

      - name: Inspect incremental Data_Goc delta
        id: delta
        if: steps.source_change.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = json.loads(Path('Data/Work/incremental_cloud_summary.json').read_text(encoding='utf-8'))
          values = {
              'rebuild_count': summary.get('rebuild_count', 0),
              'rebuild_periods': ','.join(summary.get('rebuild_periods', [])),
              'delta_file_count': summary.get('delta_file_count', 0),
              'baseline_workbooks': summary.get('baseline_workbooks', 0),
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              for key, value in values.items():
                  handle.write(f'{key}={value}\n')
          print(values)
          PY

      - name: Verify complete local Data_Goc set
        if: steps.source_change.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(Data/Data_Goc/*.xlsx)
          [[ ${#files[@]} -gt 0 ]] || { echo "::error::No Data_Goc workbook after incremental build."; exit 1; }
          echo "Complete Data_Goc set: ${#files[@]} workbook(s). Rebuilt: ${{ steps.delta.outputs.rebuild_count }}."

      - name: Upload only changed Data_Goc files and checkpoint
        if: steps.source_change.outputs.changed == 'true' && steps.delta.outputs.delta_file_count != '0'
        run: >-
          python code/Skill/skill-bao-cao/scripts/sharepoint_graph_sync.py
          --action upload
          --folder "${SHAREPOINT_BASE_FOLDER}/Data_Goc"
          --local-dir "Data/CloudOutputs/Data_GocDelta"
          --require-cloud-auth

      - name: Set up Node.js 24 for dashboard validation
        if: steps.source_change.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate generated dashboard
        if: steps.source_change.outputs.changed == 'true'
        run: npm run verify:web

      - name: Verify full dashboard payload exists
        if: steps.source_change.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s web/data/dashboard_data.json
          test -s web/data/dashboard_data.js
          echo "Full dashboard payload is ready for GitHub Pages."

      - name: Upload full dashboard as GitHub Pages artifact
        if: steps.source_change.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

      - name: Commit successful SharePoint source manifest
        if: steps.source_change.outputs.changed == 'true'
        run: >-
          python code/common/sharepoint_change_detector_v2.py
          --action commit
          --state-path "${SHAREPOINT_BASE_FOLDER}/Data_Goc/${PIPELINE_STATE_FILE}"
          --fingerprint "${{ steps.source_change.outputs.fingerprint }}"
          --file-count "${{ steps.source_change.outputs.file_count }}"
          --manifest-file "Data/Work/sharepoint_source_manifest.json"

      - name: Write refresh summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Vikoda Sell-In incremental pipeline"
            echo
            echo "- Job status: **${{ job.status }}**"
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Dispatch action: \`${{ github.event.action || 'n/a' }}\`"
            echo "- Source change: \`${{ steps.source_change.outputs.changed || 'not-checked' }}\`"
            echo "- Reason: \`${{ steps.source_change.outputs.reason || 'n/a' }}\`"
            echo "- ERP periods changed: \`${{ steps.source_change.outputs.erp_periods || 'baseline/reconcile' }}\`"
            echo "- Data_Goc periods rebuilt: \`${{ steps.delta.outputs.rebuild_periods || 'none' }}\`"
            echo "- SharePoint output: \`${SHAREPOINT_BASE_FOLDER}/Data_Goc\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-dashboard:
    name: Deploy full dashboard to GitHub Pages
    needs: [cloud-refresh]
    if: >-
      needs.cloud-refresh.result == 'success' &&
      needs.cloud-refresh.outputs.source_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      # Required by actions/deploy-pages for GitHub Pages, not Microsoft Graph.
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
