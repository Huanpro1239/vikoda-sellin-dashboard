name: Vikoda Sell-In Pipeline
run-name: Vikoda Sell-In · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  pull_request:
    paths:
      - 'code/**'
      - 'web/**'
      - 'package*.json'
      - 'requirements*.txt'
      - '.env.example'
      - 'README.md'
      - 'SECURITY.md'
      - 'HUONG_DAN_SHAREPOINT_GITHUB_ACTIONS.md'
      - 'PROJECT_AUDIT.md'
      - 'AGENTS.md'
      - '.github/workflows/vikoda_pipeline.yml'
  push:
    branches: [main]
    paths:
      - 'code/**'
      - 'web/**'
      - 'package*.json'
      - 'requirements*.txt'
      - '.env.example'
      - 'README.md'
      - 'SECURITY.md'
      - 'HUONG_DAN_SHAREPOINT_GITHUB_ACTIONS.md'
      - 'PROJECT_AUDIT.md'
      - 'AGENTS.md'
      - '.github/workflows/vikoda_pipeline.yml'
  workflow_dispatch:
    inputs:
      run_cloud_refresh:
        description: 'Check SharePoint and refresh changed Sell-In periods'
        required: true
        type: boolean
        default: true
      publish_dashboard:
        description: 'Publish public Pages only when repository security gates allow it'
        required: true
        type: boolean
        default: false
  schedule:
    # Lightweight metadata poll. No ETL is executed when SharePoint sources are unchanged.
    - cron: '*/30 * * * *'

permissions:
  contents: read

concurrency:
  group: 'vikoda-sellin-${{ github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository-hygiene:
    name: Reject production data in Git
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject changes under Data or web/data
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA_PR: ${{ github.event.pull_request.base.sha }}
          BASE_SHA_PUSH: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$BASE_SHA_PR"
          else
            BASE_SHA="$BASE_SHA_PUSH"
          fi
          if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "Không có base SHA hợp lệ; bỏ qua kiểm tra diff cho event này."
            exit 0
          fi
          blocked="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" | grep -E '^(Data/|web/data/)' || true)"
          if [[ -n "$blocked" ]]; then
            echo "::error::Không được commit dữ liệu sản xuất vào Git."
            echo "$blocked"
            exit 1
          fi

  test:
    name: Read-only CI
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned core dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements.txt
      - name: Run full Python test suite
        run: python code/run_all_tests.py --quiet
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify web JavaScript and regression tests
        run: npm run verify:web

  cloud-refresh:
    name: Detect changes and rebuild only affected Data_Goc periods
    needs: [test]
    if: >-
      always() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_cloud_refresh))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    outputs:
      source_changed: ${{ steps.source_change.outputs.changed }}
      change_reason: ${{ steps.source_change.outputs.reason }}
      rebuild_periods: ${{ steps.delta.outputs.rebuild_periods }}
      web_publish_ready: ${{ steps.web_gate.outputs.ready }}
      swa_publish_ready: ${{ steps.swa_gate.outputs.ready }}
    env:
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      SHAREPOINT_HOSTNAME: ${{ vars.SHAREPOINT_HOSTNAME || 'vikodacomvn.sharepoint.com' }}
      SHAREPOINT_SITE_PATH: ${{ vars.SHAREPOINT_SITE_PATH || '/sites/Planning' }}
      SHAREPOINT_BASE_FOLDER: ${{ vars.SHAREPOINT_BASE_FOLDER || 'Vikoda_Sales_Data' }}
      PIPELINE_STATE_FILE: ${{ vars.SHAREPOINT_PIPELINE_STATE_FILE || '_vikoda_pipeline_state.json' }}
      INCREMENTAL_STATE_FILE: ${{ vars.SHAREPOINT_INCREMENTAL_STATE_FILE || '_vikoda_incremental_state.json' }}
      ENABLE_SWA_DEPLOY: ${{ vars.ENABLE_SWA_DEPLOY }}
      ENABLE_PAGES_DEPLOY: ${{ vars.ENABLE_PAGES_DEPLOY }}
      WEB_DATA_CLASSIFICATION: ${{ vars.WEB_DATA_CLASSIFICATION }}
      MANUAL_PUBLISH_REQUEST: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_dashboard }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install lightweight Graph authentication dependency
        run: python -m pip install --disable-pip-version-check azure-identity==1.24.0

      - name: Validate Microsoft OIDC configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [[ -z "${AZURE_CLIENT_ID:-}" ]]; then
            echo "::error::AZURE_CLIENT_ID Repository Variable is missing."
            missing=1
          fi
          if [[ -z "${AZURE_TENANT_ID:-}" ]]; then
            echo "::error::AZURE_TENANT_ID Repository Variable is missing."
            missing=1
          fi
          [[ "$missing" -eq 0 ]]
          echo "Microsoft OIDC configuration: available"

      - name: Azure login with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Resolve SharePoint site and drive IDs
        run: python code/common/sharepoint_bootstrap.py

      - name: Detect SharePoint source changes and affected ERP periods
        id: source_change
        shell: bash
        env:
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.run_cloud_refresh }}
        run: |
          set -euo pipefail
          args=(
            --action check
            --state-path "${SHAREPOINT_BASE_FOLDER}/Data_Goc/${PIPELINE_STATE_FILE}"
            --folder "${SHAREPOINT_BASE_FOLDER}/Data ERP"
            --folder "${SHAREPOINT_BASE_FOLDER}/Target"
            --folder "${SHAREPOINT_BASE_FOLDER}/DanhMuc_KH"
            --folder "${SHAREPOINT_BASE_FOLDER}/DanhMuc_SP"
            --manifest-file "Data/Work/sharepoint_source_manifest.json"
          )
          if [[ "$FORCE_REFRESH" == "true" ]]; then
            args+=(--force)
          fi
          python code/common/sharepoint_change_detector_v2.py "${args[@]}"

      - name: Skip when SharePoint has no new source metadata
        if: steps.source_change.outputs.changed != 'true'
        run: >-
          echo "No SharePoint source change detected
          (${{ steps.source_change.outputs.reason }}). No download, ETL, Data_Goc upload, or web build is needed."

      - name: Install pinned production dependencies
        if: steps.source_change.outputs.changed == 'true'
        run: python -m pip install --disable-pip-version-check --requirement requirements.txt

      - name: Download existing Data_Goc baseline
        if: steps.source_change.outputs.changed == 'true'
        run: >-
          python code/Skill/skill-bao-cao/scripts/sharepoint_graph_sync.py
          --action download
          --folder "${SHAREPOINT_BASE_FOLDER}/Data_Goc"
          --local-dir "Data/CloudInputs/Data_GocBaseline"
          --require-cloud-auth

      - name: Download ERP workbooks from SharePoint
        if: steps.source_change.outputs.changed == 'true'
        run: >-
          python code/Skill/skill-bao-cao/scripts/sharepoint_graph_sync.py
          --action download
          --folder "${SHAREPOINT_BASE_FOLDER}/Data ERP"
          --local-dir "Data/CloudInputs/ERP"
          --require-cloud-auth

      - name: Download Target workbooks from SharePoint
        if: steps.source_change.outputs.changed == 'true'
        run: >-
          python code/Skill/skill-bao-cao/scripts/sharepoint_graph_sync.py
          --action download
          --folder "${SHAREPOINT_BASE_FOLDER}/Target"
          --local-dir "Data/CloudInputs/Target"
          --require-cloud-auth

      - name: Download customer catalog from SharePoint
        if: steps.source_change.outputs.changed == 'true'
        run: >-
          python code/Skill/skill-bao-cao/scripts/sharepoint_graph_sync.py
          --action download
          --folder "${SHAREPOINT_BASE_FOLDER}/DanhMuc_KH"
          --local-dir "Data/CloudInputs/DMKH"
          --require-cloud-auth

      - name: Download product catalog from SharePoint
        if: steps.source_change.outputs.changed == 'true'
        run: >-
          python code/Skill/skill-bao-cao/scripts/sharepoint_graph_sync.py
          --action download
          --folder "${SHAREPOINT_BASE_FOLDER}/DanhMuc_SP"
          --local-dir "Data/CloudInputs/DMSP"
          --require-cloud-auth

      - name: Rebuild only changed Data_Goc months and rebuild dashboard data
        if: steps.source_change.outputs.changed == 'true'
        shell: bash
        env:
          ERP_PERIODS: ${{ steps.source_change.outputs.erp_periods }}
        run: |
          set -euo pipefail
          args=(
            --project-root .
            --erp-source-dir "Data/CloudInputs/ERP"
            --baseline-data-goc-dir "Data/CloudInputs/Data_GocBaseline"
            --target-source-dir "Data/CloudInputs/Target"
            --dmkh-source-dir "Data/CloudInputs/DMKH"
            --product-catalog "Data/CloudInputs/DMSP/Danh Muc San Pham.xlsx"
            --incremental-state-file "Data/CloudInputs/Data_GocBaseline/${INCREMENTAL_STATE_FILE}"
            --plan-file "Data/Work/incremental_cloud_plan.json"
            --delta-dir "Data/CloudOutputs/Data_GocDelta"
            --summary-file "Data/Work/incremental_cloud_summary.json"
          )
          IFS=',' read -ra periods <<< "${ERP_PERIODS:-}"
          for period in "${periods[@]}"; do
            if [[ -n "$period" ]]; then
              args+=(--force-period "$period")
            fi
          done
          python code/common/incremental_cloud_pipeline.py "${args[@]}"

      - name: Finalize dashboard date from latest invoice
        if: steps.source_change.outputs.changed == 'true'
        run: python code/common/finalize_data_dates.py --project-root .

      - name: Run system health check
        if: steps.source_change.outputs.changed == 'true'
        run: python code/health_check.py

      - name: Inspect incremental Data_Goc delta
        id: delta
        if: steps.source_change.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = json.loads(Path('Data/Work/incremental_cloud_summary.json').read_text(encoding='utf-8'))
          values = {
              'rebuild_count': summary.get('rebuild_count', 0),
              'rebuild_periods': ','.join(summary.get('rebuild_periods', [])),
              'delta_file_count': summary.get('delta_file_count', 0),
              'baseline_workbooks': summary.get('baseline_workbooks', 0),
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              for key, value in values.items():
                  handle.write(f'{key}={value}\n')
          print(values)
          PY

      - name: Verify complete local Data_Goc baseline plus delta
        if: steps.source_change.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(Data/Data_Goc/*.xlsx)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::Không có workbook .xlsx trong Data/Data_Goc sau incremental build."
            exit 1
          fi
          echo "Complete Data_Goc set: ${#files[@]} workbook(s). Rebuilt: ${{ steps.delta.outputs.rebuild_count }}."

      - name: Upload only changed Data_Goc files and incremental state
        if: steps.source_change.outputs.changed == 'true' && steps.delta.outputs.delta_file_count != '0'
        run: >-
          python code/Skill/skill-bao-cao/scripts/sharepoint_graph_sync.py
          --action upload
          --folder "${SHAREPOINT_BASE_FOLDER}/Data_Goc"
          --local-dir "Data/CloudOutputs/Data_GocDelta"
          --require-cloud-auth

      - name: Set up Node.js 24 for web release validation
        if: steps.source_change.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate generated web dashboard
        if: steps.source_change.outputs.changed == 'true'
        run: npm run verify:web

      - name: Validate Azure Static Web Apps security configuration
        if: steps.source_change.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          config_path = Path('web/staticwebapp.config.json')
          login_path = Path('web/login.html')
          if not config_path.is_file() or not login_path.is_file():
              raise SystemExit('Missing web/staticwebapp.config.json or web/login.html')
          config = json.loads(config_path.read_text(encoding='utf-8'))
          routes = {item.get('route'): item for item in config.get('routes', [])}
          for route in ('/*', '/data/*'):
              roles = routes.get(route, {}).get('allowedRoles', [])
              if 'vikoda-user' not in roles:
                  raise SystemExit(f'{route} must require vikoda-user')
          if routes.get('/.auth/login/github', {}).get('statusCode') != 404:
              raise SystemExit('GitHub login provider must stay blocked')
          override = config.get('responseOverrides', {}).get('401', {})
          if override.get('redirect') != '/login.html':
              raise SystemExit('401 must redirect to /login.html')
          print('Azure Static Web Apps security config: PASS')
          PY

      - name: Evaluate authenticated Azure Static Web Apps deployment gate
        id: swa_gate
        if: steps.source_change.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          if [[ "${ENABLE_SWA_DEPLOY:-}" == "true" ]]; then
            ready=true
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [[ "$ready" == "true" ]]; then
            echo "Azure Static Web Apps deployment gate: OPEN."
          else
            echo "Azure Static Web Apps deployment gate: CLOSED. Set ENABLE_SWA_DEPLOY=true after the Azure app and deployment token are configured."
          fi

      - name: Validate Azure Static Web Apps deployment token
        if: steps.source_change.outputs.changed == 'true' && steps.swa_gate.outputs.ready == 'true'
        shell: bash
        env:
          SWA_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SWA_DEPLOYMENT_TOKEN:-}" ]]; then
            echo "::error::AZURE_STATIC_WEB_APPS_API_TOKEN Repository Secret is missing."
            exit 1
          fi
          echo "Azure Static Web Apps deployment token: available"

      - name: Deploy authenticated dashboard to Azure Static Web Apps
        if: steps.source_change.outputs.changed == 'true' && steps.swa_gate.outputs.ready == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: web
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: main

      - name: Evaluate safe public GitHub Pages deployment gate
        id: web_gate
        if: steps.source_change.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          if [[ "${ENABLE_PAGES_DEPLOY:-}" == "true" && "${WEB_DATA_CLASSIFICATION:-}" == "public-or-sanitized" && "${MANUAL_PUBLISH_REQUEST:-false}" == "true" ]]; then
            ready=true
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [[ "$ready" == "true" ]]; then
            echo "Public GitHub Pages deployment gate: OPEN."
          else
            echo "Public GitHub Pages deployment gate: CLOSED. Production data will not be published publicly."
          fi

      - name: Package public approved dashboard for GitHub Pages
        if: steps.source_change.outputs.changed == 'true' && steps.web_gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: approved-dashboard-web
          path: web
          retention-days: 1
          if-no-files-found: error

      - name: Commit successful SharePoint source manifest
        if: steps.source_change.outputs.changed == 'true'
        run: >-
          python code/common/sharepoint_change_detector_v2.py
          --action commit
          --state-path "${SHAREPOINT_BASE_FOLDER}/Data_Goc/${PIPELINE_STATE_FILE}"
          --fingerprint "${{ steps.source_change.outputs.fingerprint }}"
          --file-count "${{ steps.source_change.outputs.file_count }}"
          --manifest-file "Data/Work/sharepoint_source_manifest.json"

      - name: Write cloud refresh summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Vikoda Sell-In incremental SharePoint watcher"
            echo
            echo "- Job status: **${{ job.status }}**"
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Source change: \`${{ steps.source_change.outputs.changed || 'not-checked' }}\`"
            echo "- Reason: \`${{ steps.source_change.outputs.reason || 'n/a' }}\`"
            echo "- Source workbooks: \`${{ steps.source_change.outputs.file_count || 'n/a' }}\`"
            echo "- ERP periods changed by manifest: \`${{ steps.source_change.outputs.erp_periods || 'baseline/reconcile' }}\`"
            echo "- Data_Goc periods rebuilt: \`${{ steps.delta.outputs.rebuild_periods || 'none' }}\`"
            echo "- Data_Goc workbooks rebuilt: \`${{ steps.delta.outputs.rebuild_count || '0' }}\`"
            echo "- Azure SWA deploy gate: \`${{ steps.swa_gate.outputs.ready || 'closed' }}\`"
            echo "- Public Pages gate: \`${{ steps.web_gate.outputs.ready || 'closed' }}\`"
            echo "- Output: \`SharePoint/${SHAREPOINT_BASE_FOLDER}/Data_Goc\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-dashboard:
    name: Auto-deploy approved public dashboard to GitHub Pages
    needs: [cloud-refresh]
    if: >-
      needs.cloud-refresh.result == 'success' &&
      needs.cloud-refresh.outputs.source_changed == 'true' &&
      needs.cloud-refresh.outputs.web_publish_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download approved dashboard artifact
        uses: actions/download-artifact@v8
        with:
          name: approved-dashboard-web
          path: web
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload dashboard as Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v5
