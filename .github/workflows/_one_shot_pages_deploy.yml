name: One-shot refreshed Pages deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_one_shot_pages_deploy.yml'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download refreshed Pages artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p package/unpacked site
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/actions/artifacts/9691213128/zip" \
            > package/artifact.zip
          unzip -q package/artifact.zip -d package/unpacked
          test -s package/unpacked/artifact.tar
          tar -xf package/unpacked/artifact.tar -C site
          test -s site/data/dashboard_data.json
          test -s site/data/dashboard_data.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload refreshed Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy refreshed dashboard
        id: deployment
        uses: actions/deploy-pages@v5
