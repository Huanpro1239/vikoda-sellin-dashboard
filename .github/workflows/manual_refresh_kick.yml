name: Vikoda Manual Refresh Kick

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual_refresh_kick.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch-refresh:
    name: Dispatch production refresh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch Vikoda production pipeline
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'vikoda_pipeline.yml',
              ref: 'main',
              inputs: {
                run_cloud_refresh: 'true'
              }
            });
            core.info('Dispatched vikoda_pipeline.yml with run_cloud_refresh=true');

# Touch this file to trigger a controlled production refresh without changing data code.
