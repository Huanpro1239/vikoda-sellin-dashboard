name: Tự động Cập nhật & Triển khai Web Dashboard Vikoda

on:
  # 1. Kích hoạt theo lịch định kỳ mỗi ngày lúc 7:00 sáng (0:00 UTC)
  schedule:
    - cron: '0 0 * * *'

  # 2. Kích hoạt khi có Webhook từ Power Automate (khi có file mới trên SharePoint)
  repository_dispatch:
    types: [sharepoint_update]

  # 3. Kích hoạt thủ công bằng 1 nút bấm trên GitHub
  workflow_dispatch:

  # 4. Kích hoạt khi có commit dữ liệu mới
  push:
    branches:
      - main
      - master
    paths:
      - 'Data/**'
      - 'code/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: 📥 Tải mã nguồn dự án
        uses: actions/checkout@v4

      - name: 🐍 Cài đặt môi trường Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Cài đặt các thư viện Python
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl xlsxwriter

      - name: ⚙️ Chạy chuỗi xử lý dữ liệu ETL & Kiểm thử
        run: |
          python code/run_all_tests.py

      - name: 📊 Xuất dữ liệu nén cho Web Dashboard
        run: |
          python code/Skill/skill-bao-cao/scripts/export_web_data.py --project-root .

      - name: 🚀 Tự động Commit & Push dữ liệu mới
        run: |
          git config --global user.name "Vikoda Automation Bot"
          git config --global user.email "bot@vikoda.com.vn"
          git add web/data/
          if git diff --staged --quiet; then
            echo "Khong co du lieu moi can cap nhat."
          else
            git commit -m "🤖 Tự động cập nhật dữ liệu Web Dashboard [skip ci]"
            git push
          fi

      - name: 🌐 Triển khai lên GitHub Pages (Miễn phí 100%)
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web/'

      - name: 🚢 Xuất bản trang Web
        uses: actions/deploy-pages@v4
