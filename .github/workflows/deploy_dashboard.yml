name: Vikoda Sell-In CI, Cloud Refresh and Pages Deploy

on:
  pull_request:
    paths:
      - 'web/**'
      - 'code/**'
      - 'Data/**'
      - 'index.html'
      - 'vercel.json'
      - '.gitignore'
      - 'package*.json'
      - 'requirements*.txt'
      - '.github/workflows/deploy_dashboard.yml'
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'code/**'
      - 'Data/**'
      - 'index.html'
      - 'vercel.json'
      - '.gitignore'
      - 'package*.json'
      - 'requirements*.txt'
      - '.github/workflows/deploy_dashboard.yml'
  workflow_dispatch:
    inputs:
      deploy_now:
        description: 'Kéo dữ liệu SharePoint mới nhất, build và deploy lên GitHub Pages ngay'
        required: true
        type: boolean
        default: true
      deploy_pages:
        description: 'Tương thích Flow Power Automate cũ; nên chuyển sang deploy_now'
        required: false
        type: boolean
        default: false
  schedule:
    # 18:00 UTC+7 tương ứng 11:00 UTC; chạy một lần mỗi ngày.
    - cron: '0 11 * * *'

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository-hygiene:
    name: Reject production data in Git
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Reject changes under Data/ or web/data/
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA_PR: ${{ github.event.pull_request.base.sha }}
          BASE_SHA_PUSH: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$BASE_SHA_PR"
          else
            BASE_SHA="$BASE_SHA_PUSH"
          fi

          if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "Không có base SHA để so sánh; bỏ qua guard cho event này."
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$BASE_SHA"

          blocked=()
          while IFS=$'\t' read -r status path renamed_path; do
            [[ -z "${status:-}" ]] && continue
            printf ' - %s\t%s%s\n' "$status" "$path" "${renamed_path:+ -> $renamed_path}"

            # Cho phép PR hardening xóa dữ liệu đã tracked; chỉ chặn việc
            # thêm/sửa hoặc rename dữ liệu nhạy cảm trở lại Git.
            [[ "$status" == D* ]] && continue
            candidate="$path"
            if [[ "$status" == R* || "$status" == C* ]]; then
              candidate="$renamed_path"
            fi
            if [[ "$candidate" == Data/* || "$candidate" == web/data/* ]]; then
              blocked+=("$candidate")
            fi
          done < <(git diff --name-status "$BASE_SHA" "$GITHUB_SHA")

          if (( ${#blocked[@]} > 0 )); then
            printf 'ERROR: Không được commit dữ liệu nghiệp vụ/artifact sinh tự động vào Git:\n'
            printf ' - %s\n' "${blocked[@]}"
            echo 'Hãy lưu dữ liệu nguồn/output trong SharePoint hoặc approved storage.'
            exit 1
          fi

  test:
    name: Read-only CI
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && !inputs.deploy_now && !inputs.deploy_pages)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install pinned core dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements.txt

      - name: Run full test suite
        run: python code/run_all_tests.py --quiet

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify web JavaScript and regression tests
        run: npm run verify:web

  build-and-deploy:
    name: Cloud refresh from SharePoint and deploy to Pages
    # Static Pages chỉ được phép publish khi:
    # 1) ENABLE_PAGES_DEPLOY=true; và
    # 2) WEB_DATA_CLASSIFICATION=public-or-sanitized.
    # Không dùng GitHub Pages cho dữ liệu nội bộ/customer-level chưa được sanitize.
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_PAGES_DEPLOY == 'true' &&
      vars.WEB_DATA_CLASSIFICATION == 'public-or-sanitized' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && (inputs.deploy_now || inputs.deploy_pages)))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    env:
      # Hỗ trợ cả tên secret mới và tên cũ để tránh hỏng cấu hình đang dùng.
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || secrets.MS_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || secrets.MS_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET || secrets.MS_CLIENT_SECRET }}
      SHAREPOINT_SITE_ID: ${{ secrets.SHAREPOINT_SITE_ID }}
      SHAREPOINT_DRIVE_ID: ${{ secrets.SHAREPOINT_DRIVE_ID }}
      SHAREPOINT_HOSTNAME: ${{ vars.SHAREPOINT_HOSTNAME || 'vikodacomvn.sharepoint.com' }}
      SHAREPOINT_SITE_PATH: ${{ vars.SHAREPOINT_SITE_PATH || '/sites/Planning' }}

    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install pinned core dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements.txt

      - name: Preflight cloud config and resolve SharePoint IDs
        run: python code/common/sharepoint_bootstrap.py

      - name: Sync raw data from SharePoint
        run: >-
          python code/Skill/skill-bao-cao/scripts/sharepoint_graph_sync.py
          --action download
          --folder "${{ vars.SHAREPOINT_ERP_FOLDER || 'Data ERP' }}"
          --local-dir "Data/CloudInputs/ERP"
          --require-cloud-auth

      - name: Sync target data from SharePoint
        run: >-
          python code/Skill/skill-bao-cao/scripts/sharepoint_graph_sync.py
          --action download
          --folder "${{ vars.SHAREPOINT_TARGET_FOLDER || 'Target' }}"
          --local-dir "Data/CloudInputs/Target"
          --require-cloud-auth

      - name: Sync customer catalog from SharePoint
        run: >-
          python code/Skill/skill-bao-cao/scripts/sharepoint_graph_sync.py
          --action download
          --folder "${{ vars.SHAREPOINT_CUSTOMER_FOLDER || 'Danh muc KH' }}"
          --local-dir "Data/CloudInputs/DMKH"
          --require-cloud-auth

      - name: Sync product catalog from SharePoint
        run: >-
          python code/Skill/skill-bao-cao/scripts/sharepoint_graph_sync.py
          --action download
          --folder "${{ vars.SHAREPOINT_PRODUCT_FOLDER || 'Danh muc SP' }}"
          --local-dir "Data/CloudInputs/DMSP"
          --require-cloud-auth

      - name: Execute core data pipeline (refresh web/data)
        run: >-
          python code/Skill/skill-bao-cao/scripts/run_cloud_pipeline.py
          --project-root .
          --strict
          --erp-source-dir "Data/CloudInputs/ERP"
          --target-source-dir "Data/CloudInputs/Target"
          --dmkh-source-dir "Data/CloudInputs/DMKH"
          --product-catalog "Data/CloudInputs/DMSP/Danh Muc San Pham.xlsx"

      - name: Finalize dashboard date from latest invoice
        run: python code/common/finalize_data_dates.py --project-root .

      - name: Run system health check
        run: python code/health_check.py

      - name: Run full test suite
        run: python code/run_all_tests.py --quiet

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify web JavaScript and regression tests
        run: npm run verify:web

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard (web/) as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
