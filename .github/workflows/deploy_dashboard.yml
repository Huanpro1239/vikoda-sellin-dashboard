name: Tự động Cập nhật & Triển khai Web Dashboard Vikoda

on:
  schedule:
    - cron: '0 0 * * *'
  repository_dispatch:
    types: [sharepoint_update]
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'web/**'
      - 'code/**'
      - 'requirements.txt'
      - '.github/workflows/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: 📥 Tải mã nguồn dự án
        uses: actions/checkout@v4

      - name: 🐍 Cài đặt môi trường Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Cài đặt các thư viện Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⚙️ Tự động chạy Tách data & Xuất dữ liệu Web
        run: |
          python code/Skill/skill-bao-cao/scripts/run_cloud_pipeline.py --project-root .
          git config --global user.name "Vikoda Automation Bot"
          git config --global user.email "bot@vikoda.com.vn"
          git add web/data/ Data/File\ bao\ cao/ Data/Work/ || true
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Tự động Tách data & Cập nhật Web Dashboard [skip ci]" || true
            git push || true
          fi

      - name: 🌐 Cấu hình GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📦 Đóng gói Web Dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web/'

      - name: 🚀 Xuất bản trang Web lên GitHub Pages
        uses: actions/deploy-pages@v4
