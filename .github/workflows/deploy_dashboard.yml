name: Tự động Cập nhật & Triển khai Web Dashboard Vikoda

on:
  schedule:
    - cron: '0 0 * * *'
  repository_dispatch:
    types: [sharepoint_update]
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'web/**'
      - 'code/**'
      - 'requirements.txt'
      - '.github/workflows/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: 📥 Tải mã nguồn dự án
        uses: actions/checkout@v4

      - name: 🐍 Cài đặt môi trường Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Cài đặt các thư viện Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⚙️ Tự động chạy Tách data & Xuất dữ liệu Web
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SHAREPOINT_SITE_ID: ${{ secrets.SHAREPOINT_SITE_ID }}
          SHAREPOINT_DRIVE_ID: ${{ secrets.SHAREPOINT_DRIVE_ID }}
        run: |
          # 1. Tự động tải file mới từ thư mục SharePoint 'Data ERP' (nếu có cấu hình Azure Secret)
          python code/Skill/skill-bao-cao/scripts/sharepoint_graph_sync.py --action download --folder "Data ERP" --local-dir "Data/Data ERP" || true
          
          # 2. Chạy chuỗi Tách Data ERP & Phân bổ số liệu & Xuất Dashboard
          python code/Skill/skill-bao-cao/scripts/run_cloud_pipeline.py --project-root .
          
          # 3. Tự động đẩy các file Sell In tháng đã tách lên thư mục SharePoint 'Data_Goc'
          python code/Skill/skill-bao-cao/scripts/sharepoint_graph_sync.py --action upload --folder "Data_Goc" --local-dir "Data/Data_Goc" || true
          
          # 4. Ghi nhận dữ liệu mới vào kho GitHub
          git config --global user.name "Vikoda Automation Bot"
          git config --global user.email "bot@vikoda.com.vn"
          git add web/data/ Data/File\ bao\ cao/ Data/Work/ || true
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Tự động Tách data & Cập nhật Web Dashboard [skip ci]" || true
            git push || true
          fi

      - name: 🌐 Cấu hình GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📦 Đóng gói Web Dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web/'

      - name: 🚀 Xuất bản trang Web lên GitHub Pages
        uses: actions/deploy-pages@v4
