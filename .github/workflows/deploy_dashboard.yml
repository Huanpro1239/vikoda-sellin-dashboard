name: Vikoda Sell-In CI and Internal Validation

on:
  pull_request:
    paths:
      - 'web/**'
      - 'code/**'
      - 'package*.json'
      - 'requirements*.txt'
      - '.github/workflows/deploy_dashboard.yml'
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'code/**'
      - 'package*.json'
      - 'requirements*.txt'
      - '.github/workflows/deploy_dashboard.yml'
  workflow_dispatch:
    inputs:
      validate_internal_data:
        description: 'Run an ephemeral strict build against internal SharePoint data'
        required: true
        type: boolean
        default: false
  schedule:
    # 06:00 và 18:00 UTC+7 tương ứng 23:00 và 11:00 UTC.
    - cron: '0 23,11 * * *'

# Mọi job chỉ đọc source. Internal data is validated ephemerally and never deployed.
permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Read-only CI
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && !inputs.validate_internal_data)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install pinned core dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements.txt

      - name: Run full test suite
        run: python code/run_all_tests.py --quiet

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Verify web JavaScript and regression tests
        run: npm run verify:web

  validate-internal-build:
    name: Validate internal SharePoint build (ephemeral)
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_INTERNAL_DATA_VALIDATION == 'true' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.validate_internal_data))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install pinned core dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements.txt

      - name: Sync raw data from SharePoint
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SHAREPOINT_SITE_ID: ${{ secrets.SHAREPOINT_SITE_ID }}
          SHAREPOINT_DRIVE_ID: ${{ secrets.SHAREPOINT_DRIVE_ID }}
        run: >-
          python code/Skill/skill-bao-cao/scripts/sharepoint_graph_sync.py
          --action download
          --folder "${{ vars.SHAREPOINT_ERP_FOLDER || 'Data ERP' }}"
          --local-dir "Data/CloudInputs/ERP"
          --require-cloud-auth

      - name: Sync target data from SharePoint
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SHAREPOINT_SITE_ID: ${{ secrets.SHAREPOINT_SITE_ID }}
          SHAREPOINT_DRIVE_ID: ${{ secrets.SHAREPOINT_DRIVE_ID }}
        run: >-
          python code/Skill/skill-bao-cao/scripts/sharepoint_graph_sync.py
          --action download
          --folder "${{ vars.SHAREPOINT_TARGET_FOLDER || 'Target' }}"
          --local-dir "Data/CloudInputs/Target"
          --require-cloud-auth

      - name: Sync customer catalog from SharePoint
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SHAREPOINT_SITE_ID: ${{ secrets.SHAREPOINT_SITE_ID }}
          SHAREPOINT_DRIVE_ID: ${{ secrets.SHAREPOINT_DRIVE_ID }}
        run: >-
          python code/Skill/skill-bao-cao/scripts/sharepoint_graph_sync.py
          --action download
          --folder "${{ vars.SHAREPOINT_CUSTOMER_FOLDER || 'Danh muc KH' }}"
          --local-dir "Data/CloudInputs/DMKH"
          --require-cloud-auth

      - name: Sync product catalog from SharePoint
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SHAREPOINT_SITE_ID: ${{ secrets.SHAREPOINT_SITE_ID }}
          SHAREPOINT_DRIVE_ID: ${{ secrets.SHAREPOINT_DRIVE_ID }}
        run: >-
          python code/Skill/skill-bao-cao/scripts/sharepoint_graph_sync.py
          --action download
          --folder "${{ vars.SHAREPOINT_PRODUCT_FOLDER || 'Danh muc SP' }}"
          --local-dir "Data/CloudInputs/DMSP"
          --require-cloud-auth

      - name: Execute core data pipeline
        run: >-
          python code/Skill/skill-bao-cao/scripts/run_cloud_pipeline.py
          --project-root .
          --strict
          --erp-source-dir "Data/CloudInputs/ERP"
          --target-source-dir "Data/CloudInputs/Target"
          --dmkh-source-dir "Data/CloudInputs/DMKH"
          --product-catalog "Data/CloudInputs/DMSP/Danh Muc San Pham.xlsx"

      - name: Run system health check
        run: python code/health_check.py

      - name: Run full test suite
        run: python code/run_all_tests.py --quiet

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Verify web JavaScript and regression tests
        run: npm run verify:web

      # Không upload artifact, deploy Pages, commit hay push. Dữ liệu nội bộ chỉ
      # tồn tại trong runner tạm thời và bị hủy cùng job.
